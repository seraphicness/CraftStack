syntax = "proto3";

package craftstack;

option go_package = "craftstack/gen/proto/craftstack";

// FileManagerService handles file browsing, reading, writing within instance directories.
// Runs on the agent, called by master on behalf of web UI.
service FileManagerService {
  rpc ReadChunk(ChunkRequest) returns (ChunkResponse);
  rpc UploadChunk(UploadChunkRequest) returns (ChunkResponse);
  rpc Archive(ArchiveRequest) returns (ArchiveResponse);
  // ListDirectory returns the contents of a directory.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // ReadFile reads a file's content (up to a size limit).
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile writes content to a file (create or overwrite).
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // DeleteFile deletes a file or empty directory.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // CreateDirectory creates a new directory.
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);

  // RenameFile renames/moves a file or directory.
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);

  // CopyFile copies a file or directory (recursive).
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse);

  // GitCommit stages and commits paths inside the instance work_dir. Creates
  // the git repo on first call. Best-effort — returns success:false if git
  // isn't available on the host.
  rpc GitCommit(GitCommitRequest) returns (GitCommitResponse);

  // GitLog returns recent commits touching a specific path.
  rpc GitLog(GitLogRequest) returns (GitLogResponse);

  // GitRestore restores a file to the content it had at a specific commit.
  // A new commit recording the rollback is created automatically.
  rpc GitRestore(GitRestoreRequest) returns (GitRestoreResponse);
}

message ChunkRequest { string instance_id = 1; string path = 2; int64 offset = 3; }
message ChunkResponse { bytes content = 1; int64 offset = 2; int64 size = 3; string path = 4; bool complete = 5; }
message UploadChunkRequest {
  string instance_id = 1; string path = 2; string upload_id = 3;
  int64 offset = 4; int64 total = 5; bytes content = 6;
  string conflict = 7; bool cancel = 8; bool status = 9;
}
message ArchiveRequest {
  string instance_id = 1; string action = 2; repeated string paths = 3;
  string destination = 4; string deployment_id = 5;
}
message ArchiveResponse { bool success = 1; string path = 2; string deployment_id = 3; string message = 4; }

// --- List Directory ---

message ListDirectoryRequest {
  string instance_id = 1;
  string path = 2;  // relative path within instance work_dir (empty = root)
}

message ListDirectoryResponse {
  string current_path = 1;
  repeated FileEntry entries = 2;
}

message FileEntry {
  string name = 1;
  string path = 2;       // relative path from work_dir
  bool is_dir = 3;
  int64 size = 4;
  int64 modified_unix = 5;
  string permissions = 6;
}

// --- Read File ---

message ReadFileRequest {
  string instance_id = 1;
  string path = 2;
}

message ReadFileResponse {
  string path = 1;
  bytes content = 2;
  int64 size = 3;
  bool truncated = 4;     // true if file was too large and content was truncated
}

// --- Write File ---

message WriteFileRequest {
  string instance_id = 1;
  string path = 2;
  bytes content = 3;
  bool create_dirs = 4;   // create parent directories if they don't exist
}

message WriteFileResponse {
  bool success = 1;
  string message = 2;
}

// --- Delete ---

message DeleteFileRequest {
  string instance_id = 1;
  string path = 2;
  bool recursive = 3;     // for directories
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

// --- Create Directory ---

message CreateDirectoryRequest {
  string instance_id = 1;
  string path = 2;
}

message CreateDirectoryResponse {
  bool success = 1;
  string message = 2;
}

// --- Rename ---

message RenameFileRequest {
  string instance_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameFileResponse {
  bool success = 1;
  string message = 2;
}

// --- Copy ---

message CopyFileRequest {
  string instance_id = 1;
  string src_path = 2;
  string dst_path = 3;
  bool overwrite = 4;
}

message CopyFileResponse {
  bool success = 1;
  string message = 2;
}

// --- Git ---

message GitCommitRequest {
  string instance_id = 1;
  repeated string paths = 2;        // paths to stage (relative to work_dir). empty = all
  string message = 3;               // commit message
  string author_name = 4;           // git author.name
  string author_email = 5;          // git author.email
  bool allow_empty = 6;             // commit even if no changes
}

message GitCommitResponse {
  bool success = 1;
  string message = 2;
  string commit_sha = 3;            // short SHA when success
}

message GitLogRequest {
  string instance_id = 1;
  string path = 2;                  // file/dir path (empty = whole repo)
  int32 limit = 3;                  // default 20
}

message GitLogResponse {
  bool success = 1;
  string message = 2;
  repeated GitCommitEntry commits = 3;
}

message GitCommitEntry {
  string sha = 1;
  string author = 2;
  string email = 3;
  int64 timestamp_unix = 4;
  string message = 5;
}

message GitRestoreRequest {
  string instance_id = 1;
  string path = 2;             // file path relative to work_dir (required)
  string commit_sha = 3;       // source commit; required
  string author_name = 4;
  string author_email = 5;
}

message GitRestoreResponse {
  bool success = 1;
  string message = 2;
  string commit_sha = 3;       // SHA of the new rollback commit
}
